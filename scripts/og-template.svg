<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="120" y1="120" x2="1080" y2="555" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Soft glow -->
  <circle cx="220" cy="120" r="140" fill="#8B5CF6" fill-opacity="0.18" filter="url(#blur)"/>
  <circle cx="1030" cy="560" r="180" fill="#22C55E" fill-opacity="0.14" filter="url(#blur)"/>

  <!-- Card -->
  <rect x="72" y="72" width="1056" height="531" rx="28" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.08"/>

  <!-- Left accent bar -->
  <rect x="112" y="120" width="8" height="435" rx="4" fill="url(#accent)"/>

  <!-- Brand -->
  <text x="150" y="165" fill="white" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="700" opacity="0.95">
    1PLUS
  </text>

  <text x="150" y="203" fill="white" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="400" opacity="0.65">
    Neil Zee
  </text>

  <!-- Main title -->
  <text fill="white" xml:space="preserve" style="white-space: pre" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="0em">
    <tspan x="150" y="330">{{line1}}</tspan>
    <tspan x="150" y="400">{{line2}}</tspan>
  </text>

  <!-- Footer -->
  <text x="150" y="535" fill="white" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="400" opacity="0.55">
    1plus.me
  </text>
</svg>